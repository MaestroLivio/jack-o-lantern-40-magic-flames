script_export_mode=2

[preset.1.options]

; Every key below was checked against the Info.plist and the bundle that the
; exporter actually produced. The display name of the .app comes from the
; project name (`application/config/name` in project.godot), not from an option
; here -- setting `product_name` has no effect on macOS and is deliberately
; absent so it cannot mislead the next person editing this file.
;
; universal = one binary for both Apple Silicon and Intel Macs. The export
; refuses to build it unless both texture-compression importers are enabled in
; project.godot (see the note there).
binary_format/architecture="universal"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true
application/bundle_identifier="uk.jack.40magicflames"
application/signature="JCK40FLM"
application/app_category="Education"
application/short_version="1.0.4"
application/version="1.0.4"
; Mojave for Intel Macs (oldest still seen in schools), Big Sur for Apple
; Silicon (there is no earlier arm64 macOS).
application/min_macos_version_x86_64="10.13"
application/min_macos_version_arm64="11.00"
display/high_res=true
application/icon="res://build/icon/jack.icns"
; 1 = built-in ad-hoc signing. There is no Apple Developer certificate on the
; build machine, so this is the only option that produces a bundle whose
; signature is at least internally consistent. Gatekeeper still warns on a
; machine that has never seen the app; README.txt says how to get past it.
codesign/codesign=1
